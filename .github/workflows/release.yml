name: Release (main → image → deploy)

# Every push to `main` builds the production Docker image, pushes it to GHCR
# and (optionally) triggers your hosting platform to redeploy.
# If your platform (Coolify, Dokploy, CapRover, Railway…) already builds from
# the repo on push, you can keep only the CI workflow — see docs/deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_WEBHOOK_ENABLED == 'true' }}
    steps:
      - name: Trigger redeploy webhook
        run: curl -fsS -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
